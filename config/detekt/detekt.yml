# detekt overrides on top of the default configuration (buildUponDefaultConfig = true).
# Keep this file small: every override needs a reason.

build:
  maxIssues: 0

# Every public declaration of a library module needs KDoc (plan Task 8). Explicit API mode means
# "public" is always written out, so these rules see exactly the published API.
comments:
  UndocumentedPublicClass:
    active: true
    excludes: &notLibraryCode ['**/test/**', '**/androidTest/**', '**/sample/**', '**/build-logic/**', '**/benchmark/**']
  UndocumentedPublicFunction:
    active: true
    excludes: *notLibraryCode
  UndocumentedPublicProperty:
    active: true
    excludes: *notLibraryCode

naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    # Composables commonly take many optional parameters.
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']

style:
  MaxLineLength:
    # Same limit as ktlint (.editorconfig max_line_length).
    maxLineLength: 140
  MagicNumber:
    # Colors, dimensions and preview data are declared as properties.
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Preview']
    excludes: ['**/test/**', '**/androidTest/**', '**/benchmark/**']
  UnusedPrivateMember:
    # @Preview functions are private and only used by the IDE.
    ignoreAnnotated: ['Preview']
