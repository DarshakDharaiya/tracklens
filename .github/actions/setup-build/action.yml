name: Set up build
description: >-
  JDK for the Gradle daemon toolchain, then Gradle with caching and wrapper validation.
  Shared by every job in ci.yml.

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        # Must match toolchainVersion in gradle/gradle-daemon-jvm.properties,
        # otherwise Gradle downloads a second JDK on every run.
        java-version: '25'

    - name: Set up Gradle
      # Validates the wrapper checksum and caches Gradle state. The cache is written only on the default
      # branch; pull requests read it.
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
